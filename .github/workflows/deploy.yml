name: Deploy to GitHub Pages

# Owner decision (2026-10-03): GitHub Pages shows the Solana preview from
# branch solana-migration instead of the EVM mirror. The live EVM product keeps
# running from main on the VPS (prophetmarkets.fun); note that a push to main
# still runs main's own copy of this workflow and would put the EVM build back.
#
# Pages is static hosting: there is no price service or indexer behind it, so
# the build turns both off. Lists then read the program directly; live prices,
# USD stake quotes and game settlement (keeper) are not available here.
on:
  push:
    branches: [solana-migration]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SOLANA_CLUSTER: devnet
      VITE_PRICE_SERVICE_URL: "off"
      VITE_GAME_SERVER_URL: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, which wrote package-lock.json; npm 10 reads its peer entries as out of sync.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
