name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Exact mainnet successors after all three lifecycle canaries passed.
      # Vite rejects any mismatch while VITE_NATIVE_ETH_RELEASE is true.
      VITE_NATIVE_ETH_RELEASE: "true"
      VITE_MARKET_ADDRESS: "0x4bfd0efc15C3198fe3AFf4741FF121AB2F38060e"
      VITE_DEPLOY_BLOCK: "72300695"
      VITE_ASSET_RACE_NETWORK: "robinhood-mainnet"
      VITE_ASSET_RACE_ADDRESS: "0x02F030Bd9D9DC86d713CDF0772ae4d1E3b81f235"
      VITE_ASSET_RACE_SIGNED_POOL_ORACLE_ADDRESS: "0x5b0f7e62E0A5fF5C5C02Ad219Afcd086F2618Db7"
      VITE_PRICE_ARENA_ADDRESS: "0x383840a8Ca00dcB4b6cAc17e746c793426fE2f05"
      # GitHub Pages has no same-origin SSE backend.
      VITE_ASSET_RACE_LIVE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
