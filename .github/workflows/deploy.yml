name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Prepared V2 bindings. Publishing is still gated operationally on the
      # PredictionMarket V2 lifecycle canary and keeper cutover; Vite rejects
      # any address mismatch while VITE_NATIVE_ETH_RELEASE is true.
      VITE_NATIVE_ETH_RELEASE: "true"
      VITE_MARKET_ADDRESS: "0xF62CF5Db594c4b706555584ccEC9Fb9a61541D4a"
      VITE_DEPLOY_BLOCK: "76951947"
      VITE_ASSET_RACE_NETWORK: "robinhood-mainnet"
      VITE_ASSET_RACE_ADDRESS: "0x02F030Bd9D9DC86d713CDF0772ae4d1E3b81f235"
      VITE_ASSET_RACE_SIGNED_POOL_ORACLE_ADDRESS: "0x5b0f7e62E0A5fF5C5C02Ad219Afcd086F2618Db7"
      VITE_PRICE_ARENA_ADDRESS: "0x383840a8Ca00dcB4b6cAc17e746c793426fE2f05"
      # GitHub Pages has no same-origin SSE backend.
      VITE_ASSET_RACE_LIVE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Migration-only safety latch: code may land on main for the backend
      # keeper cutover, but Pages must not expose V2 until its two canaries and
      # the remaining V1 lifecycle queue pass the public read-only gate.
      - run: npm run preflight:prediction-market-v2
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
