name: Deploy to GitHub Pages

# Owner decision (2026-10-03): GitHub Pages shows the Solana preview from
# branch solana-migration instead of the EVM mirror. The live EVM product keeps
# running from main on the VPS (prophetmarkets.fun); note that a push to main
# still runs main's own copy of this workflow and would put the EVM build back.
#
# Two modes, switched by the repository variable SOLANA_LIVE (Settings ->
# Secrets and variables -> Actions -> Variables), no code change needed:
# - unset / not "true": a preview with the services off; the site shows the
#   last known data the VPS keeps serving.
# - "true": the real game on mainnet. Prices, the game server, RPC and
#   websockets all go through the VPS (prophetmarkets.fun/api/solana/...).
#   The VPS game server must list this site's host in SIGNING_DOMAINS.
# Re-run the workflow (Actions -> Deploy to GitHub Pages -> Run workflow)
# after changing the variable.
on:
  push:
    branches: [solana-migration]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SOLANA_CLUSTER: ${{ vars.SOLANA_LIVE == 'true' && 'mainnet-beta' || 'devnet' }}
      VITE_SOLANA_RPC_URL: ${{ vars.SOLANA_LIVE == 'true' && 'https://prophetmarkets.fun/api/solana/rpc' || '' }}
      VITE_SOLANA_WS_URL: ${{ vars.SOLANA_LIVE == 'true' && 'wss://prophetmarkets.fun/api/solana/ws' || '' }}
      VITE_PRICE_SERVICE_URL: ${{ vars.SOLANA_LIVE == 'true' && 'https://prophetmarkets.fun/api/solana/price-service' || 'off' }}
      VITE_GAME_SERVER_URL: ${{ vars.SOLANA_LIVE == 'true' && 'https://prophetmarkets.fun/api/solana/game-server' || 'off' }}
      VITE_LAST_DATA_URL: "https://prophetmarkets.fun/api/solana/last"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, which wrote package-lock.json; npm 10 reads its peer entries as out of sync.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
