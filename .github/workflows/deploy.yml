name: Deploy to GitHub Pages

# GitHub Pages builds the Solana site from main (owner, 2026-10-05: the
# solana-migration branch was merged into main; the EVM product is abandoned).
#
# Two modes, switched by the repository variable SOLANA_LIVE (Settings ->
# Secrets and variables -> Actions -> Variables), no code change needed:
# - unset / not "true": a preview with the services off; the site shows the
#   last known data the VPS keeps serving.
# - "true": the real game on mainnet. Prices, the game server, RPC and
#   websockets all go through the VPS (hastefun.xyz/api/solana/...).
#   The VPS game server must list this site's host in SIGNING_DOMAINS.
# Re-run the workflow (Actions -> Deploy to GitHub Pages -> Run workflow)
# after changing the variable.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SOLANA_CLUSTER: ${{ vars.SOLANA_LIVE == 'true' && 'mainnet-beta' || 'devnet' }}
      VITE_SOLANA_RPC_URL: ${{ vars.SOLANA_LIVE == 'true' && 'https://hastefun.xyz/api/solana/rpc' || '' }}
      VITE_SOLANA_WS_URL: ${{ vars.SOLANA_LIVE == 'true' && 'wss://hastefun.xyz/api/solana/ws' || '' }}
      VITE_PRICE_SERVICE_URL: ${{ vars.SOLANA_LIVE == 'true' && 'https://hastefun.xyz/api/solana/price-service' || 'off' }}
      VITE_GAME_SERVER_URL: ${{ vars.SOLANA_LIVE == 'true' && 'https://hastefun.xyz/api/solana/game-server' || 'off' }}
      VITE_LAST_DATA_URL: "https://hastefun.xyz/api/solana/last"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, which wrote package-lock.json; npm 10 reads its peer entries as out of sync.
          node-version: 24
          cache: npm
      # npm 12 refuses some optional wasm/native tarballs; npm 11 wrote the lockfile.
      - run: npm install -g npm@11
      # `npm ci` stops the deploy whenever the runner's npm reads the lockfile
      # differently from a developer's machine; `npm install` resolves from the
      # same lockfile and only fills what the runner's platform needs.
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
