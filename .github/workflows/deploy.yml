name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_ASSET_RACE_NETWORK: robinhood-mainnet
      VITE_ASSET_RACE_ADDRESS: "0x63E582bb395527CED97F2F94662eA93A7EDf65Ff"
      VITE_ASSET_RACE_SIGNED_POOL_ORACLE_ADDRESS: "0x5b0f7e62E0A5fF5C5C02Ad219Afcd086F2618Db7"
      # GitHub Pages has no same-origin SSE backend. Onchain races/results remain
      # available; provisional pool movement stays explicitly unavailable.
      VITE_ASSET_RACE_LIVE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
