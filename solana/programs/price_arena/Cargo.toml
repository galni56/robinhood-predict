[package]
name = "price_arena"
version = "0.1.0"
description = "Prophet Price Arena: closest-half-wins price prediction contests"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "price_arena"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "pool_attestation/idl-build", "stake_funds/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.1.2", default-features = false, features = ["associated_token", "mint", "token", "token_2022"] }
pool_attestation = { path = "../../crates/pool_attestation" }
stake_funds = { path = "../../crates/stake_funds" }
solana-sdk-ids = "3.1.0"

[dev-dependencies]
litesvm = { version = "0.10.0", features = ["precompiles"] }
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
