[workspace]
members = [
    "programs/*",
    "crates/*"
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[profile.release]
# Optimize for size: program bytes are paid for as rent (~0.007 SOL per KB).
# Overflow checks stay on - they guard fund accounting.
opt-level = "z"
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
