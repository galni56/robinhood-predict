[package]
name = "stake_funds"
version = "0.1.0"
description = "Native-SOL and SPL-token stake movement shared by Prophet programs"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "stake_funds"

[features]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.1.2"
anchor-spl = { version = "1.1.2", default-features = false, features = ["associated_token", "mint", "token", "token_2022"] }
